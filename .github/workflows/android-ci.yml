name: Android CI

on:
  push:
    branches:
      - "feature/notes-lifetime-unlock"
  pull_request:
    paths:
      - "app/**"
      - "sdocx-core/**"
      - "export-core/**"
      - "*.gradle.kts"
      - "gradle/**"
  workflow_dispatch:

jobs:
  debug-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK platform is available
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36"
          if "$SDKMANAGER" --list | grep -q "platforms;android-36.1"; then
            "$SDKMANAGER" "platforms;android-36.1"
          fi

      - name: Create CI-only signing material
        shell: bash
        run: |
          set -euo pipefail
          CI_KEYSTORE="$RUNNER_TEMP/notes-escape-ci.jks"
          keytool -genkeypair \
            -keystore "$CI_KEYSTORE" \
            -storepass ci-password \
            -keypass ci-password \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Notes Escape CI,O=CI,C=CA"
          mkdir -p "$HOME/.config/notes-escape"
          cat > "$HOME/.config/notes-escape/signing.properties" <<EOF
          storeFile=$CI_KEYSTORE
          keyAlias=ci
          storePassword=ci-password
          keyPassword=ci-password
          EOF

      - name: Unit tests, lint, and debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
